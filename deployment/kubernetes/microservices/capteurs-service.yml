apiVersion: apps/v1
kind: Deployment
metadata:
  name: capteurs-service
  namespace: irrigation-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capteurs-service
  template:
    metadata:
      labels:
        app: capteurs-service
    spec:
      containers:
      - name: capteurs-service
        image: capteurs-service:latest
        env:
        - name: SPRING_CONFIG_IMPORT
          value: "optional:configserver:http://config-service:9999"
---
apiVersion: v1
kind: Service
metadata:
  name: capteurs-service
  namespace: irrigation-system
spec:
  selector:
    app: capteurs-service
  ports:
  - port: 8081
    targetPort: 8081
