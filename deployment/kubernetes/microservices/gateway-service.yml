apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: irrigation-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
      - name: gateway-service
        image: gateway-service:latest
        ports:
        - containerPort: 5000
        env:
        - name: SPRING_CONFIG_IMPORT
          value: "optional:configserver:http://config-service:9999"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: irrigation-system
spec:
  selector:
    app: gateway-service
  ports:
  - port: 5000
    targetPort: 5000
    type: LoadBalancer # Exposed for external access
