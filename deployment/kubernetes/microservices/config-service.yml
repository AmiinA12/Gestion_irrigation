apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  namespace: irrigation-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-service
  template:
    metadata:
      labels:
        app: config-service
    spec:
      containers:
      - name: config-service
        image: config-service:latest
        ports:
        - containerPort: 9999
---
apiVersion: v1
kind: Service
metadata:
  name: config-service
  namespace: irrigation-system
spec:
  selector:
    app: config-service
  ports:
  - port: 9999
    targetPort: 9999
