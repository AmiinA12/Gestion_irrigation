# Application Configuration
spring.application.name=Gateway
server.port=5000

# Disable Config Server
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Gateway Routes Configuration
spring.cloud.gateway.routes[0].id=CAPTEURS-SERVICE
spring.cloud.gateway.routes[0].uri=lb://CAPTEURS-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/capteurs/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/capteurs/(?<segment>.*), /api/${segment}

spring.cloud.gateway.routes[1].id=IRRIGATION-SERVICE
spring.cloud.gateway.routes[1].uri=lb://IRRIGATION-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/irrigation/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/irrigation/(?<segment>.*), /api/${segment}

# Eureka Client Configuration
eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
eureka.client.serviceUrl.defaultZone=http://localhost:4040/eureka

# Management Endpoints Configuration
management.endpoints.web.exposure.include=*
management.endpoint.gateway.enabled=true
management.endpoint.health.show-details=always